name: Install gcloud-local
description: Install the local Cloud Build image executor (requires a local Docker daemon)
inputs:
  version:
    description: Version embedded in the binary (defaults to the action ref, or dev for a local action)
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/go.mod
        cache-dependency-path: ${{ github.action_path }}/go.sum
    - shell: bash
      env:
        VERSION: ${{ inputs.version || github.action_ref || 'dev' }}
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        install_dir="$RUNNER_TEMP/gcloud-local-bin"
        mkdir -p "$install_dir"
        CGO_ENABLED=0 go build -trimpath \
          -ldflags "-X 'gcloud-local/internal/localbuild.Version=${VERSION}'" \
          -o "$install_dir/gcloud-local" ./cmd/gcloud-local
        echo "$install_dir" >> "$GITHUB_PATH"
