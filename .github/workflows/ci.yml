name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -o gcloud-local ./cmd/gcloud-local
      - run: GCLOUD_LOCAL_INTEGRATION=1 go test -v ./internal/localbuild -run TestDockerIntegration
